<!DOCTYPE html>

<style>
/* VOICE: echtes Social-App-Gefühl, ernstes Thema, ruhig
IDEA: ein Handy-Profil, das sich bedienen lässt wie die echte App
PICTURE: die App selbst: Profil, Raster, Reels, Stories, Nachrichten
COLOUR/TYPE: App-Weiß/Schwarz; Beiträge in Dunkelblau, Warmgelb, Creme; Inter
LAYOUT: Handybreite zentriert, Navigationsleiste unten */
:root{color-scheme:light dark;--bg:light-dark(#fff,#000);--ink:light-dark(#111,#f5f5f5);--mut:light-dark(#737373,#a8a8a8);--line:light-dark(#dbdbdb,#262626);--chip:light-dark(#efefef,#262626);--outer:light-dark(#efe9df,#111);--blue:#0d2a5c;--yel:#ffc93c}

*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--outer);color:var(--ink);font:14px/1.4 Inter,system-ui,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible{outline:2px solid #0095f6;outline-offset:2px}
#app{position:relative;max-width:430px;height:100dvh;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
@media(min-width:600px){#app{height:min(900px,96dvh);margin-top:2dvh;border-radius:28px;box-shadow:0 20px 60px #0003}}
.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;display:block}
.top{display:flex;align-items:center;gap:12px;height:52px;padding:0 14px;border-bottom:1px solid var(--line);flex:none}
.top h1{font-size:18px;font-weight:700;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top button{width:36px;height:40px;display:grid;place-items:center;flex:none}
.badge{font-size:10.5px;font-weight:700;background:light-dark(#fff1c4,#3a3010);color:light-dark(#6b4e00,#ffd970);padding:3px 8px;border-radius:99px;flex:none}
#app.rv .top{display:none}
.view{flex:1;min-height:0;overflow-y:auto;display:none;overscroll-behavior:contain}
.view.on{display:block}
.nav{flex:none;display:flex;justify-content:space-around;align-items:center;height:56px;border-top:1px solid var(--line);background:var(--bg)}
.nav button{width:48px;height:48px;display:grid;place-items:center}
.nav .cur .i{stroke-width:2.7}.nav .cur .av{outline:2px solid currentColor;outline-offset:1px}

.av{display:inline-block;border-radius:50%;overflow:hidden;flex:none}

.av.s{width:32px;height:32px}.av.xs{width:26px;height:26px}.av.big{width:88px;height:88px}

/* Profil */
.pro{padding:14px 16px 4px}

.stats{flex:1;display:flex;justify-content:space-around;text-align:center}
.stats b{display:block;font-size:17px}.stats span{font-size:13px}
.bio{margin-top:10px;display:flex;flex-direction:column}
.bio p{margin:4px 0}
.lnk{color:light-dark(#00376b,#e0f1ff);font-weight:600;display:flex;align-items:center;gap:4px;text-align:left}
.lnk .i{width:16px;height:16px}
.btns{display:flex;gap:8px;margin:12px 0}
.btns button{flex:1;height:36px;border-radius:9px;font-weight:600}
.b1{background:#0095f6;color:#fff}.b1.off,.b2{background:var(--chip);color:var(--ink)}
.hls,.stories{display:flex;gap:14px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
.stories{padding:12px;border-bottom:1px solid var(--line)}
.hl{display:flex;flex-direction:column;align-items:center;gap:6px;flex:none;width:68px}

.pb{position:absolute;top:10px;right:10px;z-index:4;opacity:.75;background:#0008;backdrop-filter:blur(6px);color:#fff;border-radius:99px;padding:7px 12px;font-size:12.5px;font-weight:600}

/* Beiträge */
.post{border-bottom:1px solid var(--line);padding-bottom:6px}
.ph{display:flex;align-items:center;gap:10px;padding:10px 12px}
.media{position:relative;cursor:pointer}
.pop{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;opacity:0;z-index:3}
.pop .i{width:96px;height:96px;fill:#fff;stroke:none;filter:drop-shadow(0 4px 14px #0006)}

.acts{display:flex;gap:10px;padding:6px 8px 2px}
.acts button{width:40px;height:40px;display:grid;place-items:center}
.acts .sv{margin-left:auto}
.liked .i{fill:#ff3040;stroke:#ff3040;animation:bump .3s}

.txt{padding:0 12px}.txt p,.cl p{margin:4px 0}
.cf,.rf{display:flex;gap:8px;margin:4px 0}
.cf input,.rf input,.dmf input,.sbx input{flex:1;font:16px Inter,system-ui,sans-serif;background:transparent;color:var(--ink);border:0;outline:0;padding:9px 0}
.cf button,.rf button,.dmf button{color:#0095f6;font-weight:600;padding:0 8px}
/* Reels */

@keyframes drift{to{transform:translate(6%,4%) scale(1.1)}}
.rc{position:absolute;left:20px;right:74px;top:14%;display:flex;flex-direction:column;gap:14px}
.rt{font-size:clamp(26px,8vw,32px);line-height:1.08;font-weight:800;text-wrap:balance}
.ln{opacity:0;transform:translateY(14px);animation:in .6s var(--d) forwards;font-size:18px;font-weight:600;background:#0007;padding:8px 12px;border-radius:10px;align-self:flex-start}
@keyframes in{to{opacity:1;transform:none}}
.reel:not(.play) *,.reel.paused *{animation-play-state:paused!important}

.side{position:absolute;right:8px;bottom:118px;display:flex;flex-direction:column;gap:16px;align-items:center;z-index:2}
.side button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12.5px;font-weight:600;color:#fff;min-width:48px}
.side .i{width:30px;height:30px}
.rinfo{position:absolute;left:14px;right:72px;bottom:20px;z-index:2}
.rinfo div{display:flex;align-items:center;gap:8px}

.fo{border:1px solid #fffa;border-radius:8px;padding:5px 10px;font-size:13px;font-weight:600;color:#fff;flex:none}
.rinfo p{margin:8px 0 6px}.rinfo small{font-size:12.5px;opacity:.9}
.rvid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
.reel:has(.rvid) .bar{display:none}
.bar{position:absolute;left:0;right:0;bottom:0;height:3px;background:#fff3}
.bar i{display:block;height:100%;background:#fff;width:0;animation:prog 10s linear infinite}
@keyframes prog{to{width:100%}}
/* Overlays */
.ov{position:absolute;inset:0;background:var(--bg);z-index:20;display:none;flex-direction:column}
.ov.on{display:flex}
.ovs{flex:1;overflow-y:auto}
#sheet{position:absolute;inset:0;z-index:25;background:#0007;display:none;align-items:flex-end}
#sheet.on{display:flex}
.shb{background:var(--bg);color:var(--ink);width:100%;max-height:72%;border-radius:16px 16px 0 0;display:flex;flex-direction:column;padding:8px 16px 12px}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 10px}
.shb h2{font-size:15px;text-align:center;margin:0 0 8px}
.shb .cl{overflow-y:auto;flex:1}
.rf{border-top:1px solid var(--line);margin-top:8px}
#story{position:absolute;inset:0;z-index:30;background:var(--c);color:var(--f);display:none;flex-direction:column;padding:12px;cursor:pointer;user-select:none}
#story.on{display:flex}
.seg{display:flex;gap:4px}
.seg i{flex:1;height:3px;background:color-mix(in srgb,currentColor 30%,transparent);border-radius:2px;overflow:hidden}
.seg u{display:block;height:100%;width:0;background:currentColor}
.seg .done u{width:100%}.seg .run u{animation:prog 5s linear forwards}
.sh2{display:flex;align-items:center;gap:8px;margin-top:10px}
.sh2 em{font-style:normal;opacity:.7;font-size:13px}
.sh2 button{margin-left:auto;width:44px;height:44px;display:grid;place-items:center}
.sb{flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 10px}
.sb b{font-size:clamp(28px,9vw,40px);line-height:1.08;font-weight:800;text-wrap:balance}
.sb p{font-size:18px;opacity:.9}
.hint{text-align:center;font-size:12px;opacity:.6}
.msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:6px}
.m{max-width:78%;padding:9px 13px;border-radius:20px;background:var(--chip);align-self:flex-start}
.m.me{align-self:flex-end;background:#3797f0;color:#fff}
.dmf{display:flex;gap:8px;margin:8px 12px 12px;border:1px solid var(--line);border-radius:99px;padding:0 6px 0 16px;align-items:center}
.simg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
.sclose{position:absolute;top:22px;right:8px;z-index:3;width:44px;height:44px;display:grid;place-items:center;color:#fff}
.opt{display:block;width:100%;text-align:left;padding:14px 4px;font-size:16px;font-weight:600;border-top:1px solid var(--line)}
.npv{width:100%;max-height:45vh;object-fit:contain;border-radius:8px;background:#000}
.np{display:flex;gap:8px;border-top:1px solid var(--line);margin-top:8px}
.np input{flex:1;font:16px Inter,system-ui,sans-serif;background:transparent;color:var(--ink);border:0;outline:0;padding:10px 0}
.np button{color:#0095f6;font-weight:600;padding:0 8px}
.rc[hidden]{display:none}
.shimg{position:relative;z-index:2;color:#fff;text-shadow:0 1px 4px #0008}
.shimg{margin-top:12px;gap:12px}.shimg .av.ring{width:56px;height:56px;padding:3px;background:conic-gradient(#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5,#feda75)}.shimg .av.ring img,.shimg .av.ring svg{border:3px solid #000;border-radius:50%}.shimg b{font-size:17px}.shimg em{font-size:14px;opacity:.85}

.ggx i,.sgg i{font-style:normal;font-weight:800;font-size:4.4cqi;margin-top:2cqi}.ggx small,.sgg small{font-size:3.2cqi;opacity:.85}.yy{color:#FFD84D}
.sgg{position:absolute;z-index:2;top:18%;left:7%;container-type:inline-size;width:86%;color:#fff;display:flex;flex-direction:column;gap:1cqi;text-shadow:0 2px 8px #000a}
.cvr .ptx b{font-size:11cqi}

<body>
<div id="app">

</div>

{

const P={
heart:'<path d="M12 20.5s-7.5-4.6-9.3-9.2C1.4 7.9 3.6 4.5 7 4.5c2.1 0 3.6 1.1 5 3 1.4-1.9 2.9-3 5-3 3.4 0 5.6 3.4 4.3 6.8-1.8 4.6-9.3 9.2-9.3 9.2z"/>',

{t:'Selma Montgomery Wahlrecht Voting Rights Act 1965',art:art(R,C,'<span class="k">1965</span><b>Von Selma nach Montgomery</b><small>Für das Wahlrecht. Am 6. August 1965 wird der Voting Rights Act unterschrieben.</small>'),cap:'Wir sind von Selma bis nach Montgomery marschiert, für das Recht, wählen zu dürfen. Am Ende standen rund 25.000 Menschen mit uns vor dem Kapitol. Im August wurde der Voting Rights Act unterschrieben. #Wahlrecht #Selma',likes:184200,when:'März 1965',com:[['selma.sue','Ich war auf der Brücke dabei.'],['freedomrider61','Wir lassen uns nicht aufhalten!']]},

  $('#top').innerHTML=`<h1>${v==='profile'?USER:v==='home'?'Startseite':'Entdecken'}</h1><span class="badge">Mockup</span>`+(v==='home'?`<button data-a="msg" aria-label="Nachrichten">${ic('send')}</button>`:`<button data-a="plus" aria-label="Neuer Beitrag">${ic('plus')}</button><button data-a="menu" aria-label="Menü">${ic('menu')}</button>`);
  renderNav(v);
}
function updatePost(i){document.querySelectorAll(`.post[data-i="${i}"]`).forEach(el=>el.outerHTML=renderPost(posts[i],i))}
const pop=el=>{el.classList.remove('go');void el.offsetWidth;el.classList.add('go')};
function likePost(i,force){const p=posts[i];if(force&&p.liked)return;p.liked=!p.liked;p.likes+=p.liked?1:-1;updatePost(i)}
function likeReel(i,force){const r=reels[i];if(!(force&&r.liked)){r.liked=!r.liked;r.likes+=r.liked?1:-1}document.querySelectorAll(`[data-a=rlike][data-i="${i}"]`).forEach(b=>{b.classList.toggle('liked',!!r.liked);b.querySelector('span').textContent=fmt(r.likes)})}
const last={};let tapT=null;
function artTap(i){const n=Date.now();if(n-(last[i]||0)<330){likePost(i,true);document.querySelectorAll(`.post[data-i="${i}"] .pop`).forEach(pop);last[i]=0}else last[i]=n}
function reelTap(el,i){const vv=el.querySelector('video');if(vv&&(vv.muted||vv.paused)&&soundOn&&!el.classList.contains('paused')){vv.muted=false;vv.play().catch(()=>{});el.classList.remove('needtap');return}if(tapT){clearTimeout(tapT);tapT=null;likeReel(i,true);pop(el.querySelector('.pop'))}else tapT=setTimeout(()=>{tapT=null;el.classList.toggle('paused');const v=el.querySelector('video');if(v){if(el.classList.contains('paused'))v.pause();else v.play().catch(()=>{})}},260)}
function openPosts(i){const o=$('#postov');o.innerHTML=`<header class="top"><button data-a="back" data-o="postov" aria-label="Zurück">${ic('back')}</button><h1>Beiträge</h1></header><div class="ovs">${posts.map(renderPost).join('')}</div>`;o.classList.add('on');o.querySelector(`.post[data-i="${i}"]`).scrollIntoView()}
function openSheet(i){const r=reels[i];$('#sheet').innerHTML=`<div class="shb"><div class="grab"></div><h2>Kommentare</h2><div class="cl">${r.com.map(c=>`<p><b>${c[0]}</b> ${c[1]}</p>`).join('')}</div><form class="rf" data-i="${i}"><input placeholder="Kommentar hinzufügen …" aria-label="Kommentar"><button>Posten</button></form></div>`;$('#sheet').classList.add('on')}
const st={h:0,s:0,t:null};
let soundOn=true;
function playV(v){v.muted=!soundOn;const p=v.play();if(p&&p.catch)p.catch(()=>{v.muted=true;v.play().catch(()=>{});const r=v.closest('.reel');if(r)r.classList.add('needtap')})}
const myStory=[{img:PH.nob,ov:'<div class="sgg"><b class="y">GG</b><em>= Gewaltlos<br>Gewonnen</em><i>Friedensnobelpreis</i><small>Oslo, 10.12.1964</small></div>'}];
const getH=()=>st.h==='me'?{n:'Story',c:'#000',f:'#fff',sl:myStory}:hl[st.h];
function openStory(h){st.h=h;st.s=0;$('#story').classList.add('on');showSlide()}
function closeStory(){clearTimeout(st.t);$('#story').classList.remove('on')}
function showSlide(){
  const H=getH();if(st.s>=H.sl.length){closeStory();return}
  const sl=H.sl[st.s],s=$('#story');
  if(sl.img){s.style.setProperty('--c','#000');s.style.setProperty('--f','#fff');s.innerHTML=`<img class="simg" src="${sl.img}" alt="Story" style="object-fit:cover">${sl.ov||''}<div class="seg" style="position:relative;z-index:2">${H.sl.map((_,k)=>`<i class="${k<st.s?'done':k===st.s?'run':''}"><u></u></i>`).join('')}</div><div class="sh2 shimg"><span class="av s ring">${AV}</span><b>dr.mlk.jr</b><em>vor 2 Std.</em></div><button data-a="close" class="sclose" aria-label="Schließen">${ic('x')}</button>`;clearTimeout(st.t);st.t=setTimeout(()=>{st.s++;showSlide()},6000);return}
  const [a,b]=sl;s.style.setProperty('--c',H.c);s.style.setProperty('--f',H.f);
  s.innerHTML=`<div class="seg">${H.sl.map((_,k)=>`<i class="${k<st.s?'done':k===st.s?'run':''}"><u></u></i>`).join('')}</div><div class="sh2"><span class="av s">${AV}</span><b>${H.n}</b><em>${st.s+1}/${H.sl.length}</em><button data-a="close" aria-label="Schließen">${ic('x')}</button></div><div class="sb"><b>${a}</b><p>${b}</p></div><p class="hint">Tippe rechts für weiter, links für zurück</p>`;
  clearTimeout(st.t);st.t=setTimeout(()=>{st.s++;showSlide()},5000);
}
const dm=[{me:0,t:'Hey, danke fürs Vorbeischauen! Dies ist ein Gedenkprofil aus einem Schulprojekt.'}];
const replies=['Danke für deine Nachricht! Ich antworte, so schnell ich kann.','Gute Frage! Dazu mache ich bald einen eigenen Post.','Schön, dass du mitmachen willst. Schau dir mein Highlight „Gewaltlos“ an.'];let rc=0;
function openDM(){const o=$('#dm');o.innerHTML=`<header class="top"><button data-a="back" data-o="dm" aria-label="Zurück">${ic('back')}</button><span class="av s">${AV}</span><h1 style="font-size:16px">Dr. King</h1></header><div class="msgs"></div><form class="dmf"><input placeholder="Nachricht schreiben …" aria-label="Nachricht"><button>Senden</button></form>`;o.classList.add('on');renderDM()}
function renderDM(){const m=$('#dm .msgs');if(!m)return;m.innerHTML=dm.map(x=>`<div class="m ${x.me?'me':''}">${x.t}</div>`).join('');m.scrollTop=m.scrollHeight}
document.addEventListener('click',e=>{
  const s=e.target.closest('#story');
  if(s&&!e.target.closest('button')){const r=s.getBoundingClientRect();if(e.clientX-r.left<r.width/3)st.s=Math.max(0,st.s-1);else st.s++;showSlide();return}
  if(e.target.id==='sheet'){$('#sheet').classList.remove('on');return}
  const b=e.target.closest('[data-a]');
  if(!b){const rl=e.target.closest('.reel');if(rl){reelTap(rl,+rl.dataset.r);return}const md=e.target.closest('.post .media');if(md)artTap(+md.closest('.post').dataset.i);return}
  const a=b.dataset.a,i=+b.dataset.i;
  if(a==='nav')go(b.dataset.v);
  else if(a==='plus'){$('#sheet').innerHTML=`<div class="shb"><div class="grab"></div><h2>Erstellen</h2><button class="opt" data-a="new" data-k="post">Beitrag (Foto)</button><button class="opt" data-a="new" data-k="story">Story</button><button class="opt" data-a="new" data-k="av">Profilbild ändern</button></div>`;$('#sheet').classList.add('on')}
  else if(a==='new'){newKind=b.dataset.k;$('#sheet').classList.remove('on');$('#fi').click()}
  else if(a==='mystory')openStory('me');
  else if(a==='menu')toast('Einstellungen gibt es in diesem Mockup nicht.');
  else if(a==='link')toast('Der Link ist nur angedeutet. Das echte King Center findest du unter thekingcenter.org.');
  else if(a==='follow'){following=!following;followers+=following?1:-1;renderProfile();document.querySelectorAll('.fo').forEach(x=>x.textContent=following?'Gefolgt':'Folgen');toast(following?'Du folgst jetzt Dr. King.':'Du folgst Dr. King nicht mehr.')}
  else if(a==='msg')toast('Dies ist ein Gedenkprofil. Nachrichten sind nicht möglich.');
  else if(a==='hl')openStory(i);
  else if(a==='tab'){tab=b.dataset.t;renderProfile()}
  else if(a==='open')openPosts(i);
  else if(a==='openreel'){go('reels');requestAnimationFrame(()=>$('#reels').children[i].scrollIntoView())}
  else if(a==='like')likePost(i);
  else if(a==='snd'){soundOn=!soundOn;if(soundOn)ac();else musStop();document.querySelectorAll('.rvid').forEach(v=>{v.muted=!soundOn});document.querySelectorAll('.sndi').forEach(x=>x.textContent=soundOn?'🔊':'🔇');document.querySelectorAll('.sndt').forEach(x=>x.textContent=soundOn?'Ton aus':'Ton an');document.querySelectorAll('.reel').forEach(r=>r.classList.remove('needtap'));const cur=document.querySelector('.reel.play video');if(cur){cur.muted=!soundOn;cur.play().catch(()=>{})}}
  else if(a==='pic'){tgt=i;newKind='pic';$('#fi').click()}
  else if(a==='avpic'){tgt=-1;$('#fi').click()}
  else if(a==='save'){posts[i].saved=!posts[i].saved;updatePost(i);toast(posts[i].saved?'Gespeichert.':'Aus Gespeichert entfernt.')}
  else if(a==='cfocus')b.closest('.post').querySelector('.cf input').focus();
  else if(a==='share')toast('Teilen ist im Mockup nur angedeutet.');
  else if(a==='back')$('#'+b.dataset.o).classList.remove('on');
  else if(a==='close')closeStory();
  else if(a==='rlike')likeReel(i);
  else if(a==='rcom')openSheet(i);
});
document.addEventListener('submit',e=>{
  e.preventDefault();const f=e.target,inp=f.querySelector('input'),t=inp.value.trim();if(!t)return;const i=+f.dataset.i;
  if(f.classList.contains('cf')){posts[i].com.push(['du',esc(t)]);updatePost(i)}
  else if(f.classList.contains('rf')){reels[i].com.push(['du',esc(t)]);openSheet(i);document.querySelectorAll(`[data-a=rcom][data-i="${i}"] span`).forEach(x=>x.textContent=reels[i].com.length)}
  else if(f.classList.contains('dmf')){dm.push({me:1,t:esc(t)});renderDM();setTimeout(()=>{dm.push({me:0,t:replies[rc++%replies.length]});renderDM()},1100)}
  inp.value='';
});
$('#reels').addEventListener('animationiteration',e=>{if(!e.target.matches('.bar i'))return;e.target.closest('.reel').querySelectorAll('.ln').forEach(l=>{l.style.animation='none';void l.offsetWidth;l.style.animation=''})});
$('#search').innerHTML=`<div class="sbx"><label>${ic('search')}<input id="q" placeholder="Suchen" aria-label="Suchen"></label></div><div class="grid" id="sg"></div>`;
$('#q').addEventListener('input',renderSearch);
let newKind='post',pendImg=null;
const rerender=()=>{renderHome();renderProfile();renderSearch();renderReels();if($('#postov').classList.contains('on'))openPosts(0)};
$('#fi').addEventListener('change',()=>{const f=$('#fi').files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const u=r.result;
 if(newKind==='pic'){posts[tgt].img=u;rerender();if($('#postov').classList.contains('on'))openPosts(tgt);toast('Foto eingefügt.')}
 else if(newKind==='av'){AV=`<img src="${u}" alt="" style="width:100%;height:100%;object-fit:cover;display:block">`;rerender();toast('Profilbild geändert.')}
 else if(newKind==='story'){myStory.push({img:u});toast('Zur Story hinzugefügt.');openStory('me');st.s=myStory.length-1;showSlide()}
 else{pendImg=u;$('#sheet').innerHTML=`<div class="shb"><div class="grab"></div><h2>Neuer Beitrag</h2><img src="${u}" alt="" class="npv"><form class="np"><input placeholder="Bildunterschrift schreiben …" aria-label="Bildunterschrift"><button>Teilen</button></form></div>`;$('#sheet').classList.add('on');setTimeout(()=>$('.np input').focus(),50)}
};r.readAsDataURL(f);$('#fi').value=''});
document.addEventListener('submit',e=>{const f=e.target;if(!f.classList.contains('np'))return;e.preventDefault();const t=esc(f.querySelector('input').value.trim()||'');posts.unshift({t:t||'Neuer Beitrag',art:'',img:pendImg,cap:t,likes:0,when:'Gerade eben',com:[]});pendImg=null;$('#sheet').classList.remove('on');rerender();toast('Beitrag geteilt.')},true);

let AC=null,musT=null,musMood=null,nextT=0,step=0;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
document.addEventListener('pointerdown',()=>{if(soundOn)ac()},{capture:true});
const NT=m=>440*Math.pow(2,(m-69)/12);
const PROG={fun:[[48,55,60,64],[43,50,55,59],[45,52,57,60],[41,48,53,57]],calm:[[45,52,57,60],[41,48,53,57],[48,55,60,64],[43,50,55,59]]};
function tone(f,t,d,g,type='triangle',cut=2400){const o=AC.createOscillator(),v=AC.createGain(),fl=AC.createBiquadFilter();o.type=type;o.frequency.value=f;fl.type='lowpass';fl.frequency.value=cut;v.gain.setValueAtTime(0,t);v.gain.linearRampToValueAtTime(g,t+0.01);v.gain.exponentialRampToValueAtTime(0.0008,t+d);o.connect(fl);fl.connect(v);v.connect(MG);o.start(t);o.stop(t+d+0.05)}
function kickS(t){const o=AC.createOscillator(),v=AC.createGain();o.frequency.setValueAtTime(120,t);o.frequency.exponentialRampToValueAtTime(45,t+0.12);v.gain.setValueAtTime(0.6,t);v.gain.exponentialRampToValueAtTime(0.001,t+0.35);o.connect(v);v.connect(MG);o.start(t);o.stop(t+0.4)}
let NB=null;function noiseS(t,d,g,hp){if(!NB){NB=AC.createBuffer(1,AC.sampleRate*0.5,AC.sampleRate);const c=NB.getChannelData(0);for(let i=0;i<c.length;i++)c[i]=Math.random()*2-1}const s=AC.createBufferSource(),v=AC.createGain(),f=AC.createBiquadFilter();s.buffer=NB;f.type='highpass';f.frequency.value=hp;v.gain.setValueAtTime(g,t);v.gain.exponentialRampToValueAtTime(0.001,t+d);s.connect(f);f.connect(v);v.connect(MG);s.start(t);s.stop(t+d+0.02)}
let MG=null;
function musStart(m){if(!soundOn||!ac())return;if(musMood===m&&musT)return;musStop();musMood=m;MG=AC.createGain();MG.gain.value=0.5;const dl=AC.createDelay();dl.delayTime.value=m==='calm'?0.42:0.27;const fb=AC.createGain();fb.gain.value=0.3;MG.connect(AC.destination);MG.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(AC.destination);nextT=AC.currentTime+0.1;step=0;musT=setInterval(sched,60)}
function musStop(){clearInterval(musT);musT=null;musMood=null;if(MG){try{MG.gain.setTargetAtTime(0,AC.currentTime,0.08)}catch(e){}MG=null}}
function sched(){if(!MG)return;const fun=musMood==='fun',b=fun?60/104/2:60/72/2;while(nextT<AC.currentTime+0.25){const bar=Math.floor(step/8)%4,ch=PROG[musMood][bar],s8=step%8,t=nextT;
 if(fun){if(s8%4===0)kickS(t);if(s8%4===2)noiseS(t,0.18,0.35,1200);noiseS(t,0.05,0.12,7000);if(s8===0||s8===3||s8===6)ch.forEach((n,k)=>tone(NT(n+12),t+k*0.012,0.5,0.06,'triangle',3200));if(s8%2===0)tone(NT(ch[0]-12),t,0.3,0.22,'sine',900)}
 else{tone(NT([ch[1],ch[2],ch[3],ch[2]+12,ch[3]+12,ch[2]+12,ch[3],ch[2]][s8]+12),t,1.8,0.09,'sine',3000);if(s8===0){tone(NT(ch[0]),t,3.5,0.18,'sine',800);ch.slice(1).forEach(n=>tone(NT(n),t,3.4,0.035,'triangle',1200))}}
 nextT+=b;step++}}
let curReel=null,rt=0;
setInterval(()=>{const el=document.querySelector('#reels.on .reel.play:not(.paused)')||($('#reels').classList.contains('on')?document.querySelector('.reel.play:not(.paused)'):null);
 if(!el||!$('#reels').classList.contains('on')){if(musT)musStop();curReel=null;return}
 const r=reels[+el.dataset.r];if(curReel!==el){curReel=el;rt=0}
 if(r.mood)musStart(r.mood);else musStop();
 if(!r.slides)return;rt+=0.1;const tot=r.slides.reduce((a,x)=>a+x.d,0),t=rt%tot;let acc=0,k=0;for(;k<r.slides.length;k++){if(t<acc+r.slides[k].d)break;acc+=r.slides[k].d}
 const sl=el.querySelectorAll('.sl');sl.forEach((x,n)=>x.classList.toggle('on',n===k));const bi=el.querySelector('.sbar i');if(bi)bi.style.width=(t/tot*100)+'%'},100);
renderHome();renderProfile();renderSearch();renderReels();go('profile');
}
</script>
